<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Español — Julia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0c0a;
    --surface: #161411;
    --border: #2a2520;
    --text: #e8ddd0;
    --textMid: #a09080;
    --textLight: #5a4f44;
    --gold: #c8a96e;
    --goldDim: #8a6f40;
    --red: #c05c4a;
    --green: #4a9e72;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  /* Ambient background elements */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(ellipse, rgba(74,158,114,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--goldDim);
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 14vw, 72px);
    font-weight: 300;
    line-height: 0.95;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    font-size: 13px;
    color: var(--textLight);
    letter-spacing: 0.05em;
    margin-bottom: 56px;
  }

  .apps {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
  }

  .app-card {
    display: block;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    text-align: left;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .app-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .app-card.gold::before {
    background: radial-gradient(ellipse at 20% 50%, rgba(200,169,110,0.08) 0%, transparent 60%);
  }

  .app-card.green::before {
    background: radial-gradient(ellipse at 20% 50%, rgba(74,158,114,0.08) 0%, transparent 60%);
  }

  .app-card:hover, .app-card:active {
    border-color: var(--textLight);
    transform: translateY(-1px);
  }

  .app-card:hover::before, .app-card:active::before {
    opacity: 1;
  }

  .app-card:active {
    transform: translateY(0px);
  }

  .app-icon {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
    line-height: 1;
  }

  .app-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-name-badge {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 20px;
    vertical-align: middle;
  }

  .gold .app-name-badge {
    background: rgba(200,169,110,0.15);
    color: var(--gold);
  }

  .green .app-name-badge {
    background: rgba(74,158,114,0.15);
    color: var(--green);
  }

  .app-desc {
    font-size: 13px;
    color: var(--textMid);
    line-height: 1.5;
  }

  .app-arrow {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--textLight);
    font-size: 18px;
    transition: transform 0.2s, color 0.2s;
  }

  .app-card:hover .app-arrow {
    transform: translateY(-50%) translateX(3px);
    color: var(--textMid);
  }

  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: var(--textLight);
    letter-spacing: 0.05em;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f0e8;
      --surface: #fff;
      --border: #e0d8cc;
      --text: #1a1410;
      --textMid: #6b5f52;
      --textLight: #a8988a;
      --gold: #9a7030;
      --goldDim: #b8903a;
      --green: #2d7a52;
    }
  }
</style>
</head>
<body>
<div class="container">
  <p class="eyebrow">Julia's Spanish</p>
  <h1>Aprender<br><em>Español</em></h1>
  <p class="subtitle">Choose your study mode</p>

  <div class="apps">
    <a href="flashcards.html" class="app-card gold">
      <span class="app-icon">🃏</span>
      <div class="app-name">
        Flashcards
        <span class="app-name-badge">Vocabulary</span>
      </div>
      <div class="app-desc">Spaced repetition · Voice recognition · Conjugation drills</div>
      <span class="app-arrow">›</span>
    </a>

    <a href="learning.html" class="app-card green">
      <span class="app-icon">📖</span>
      <div class="app-name">
        Immersión
        <span class="app-name-badge">New</span>
      </div>
      <div class="app-desc">Reading · Grammar · Writing · Listening comprehension</div>
      <span class="app-arrow">›</span>
    </a>
  </div>

  <p class="footer">Hosted on GitHub Pages</p>
</div>
</body>
</html>
